<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Hunt HQ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141a14'/%3E%3Ccircle cx='32' cy='32' r='16' fill='none' stroke='%23e0893a' stroke-width='5'/%3E%3Cpath d='M32 8v14M32 42v14M8 32h14M42 32h14' stroke='%23e0893a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem('hunthq_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/app.css?v=20261113075752-75055de">
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/supabase.js"></script>
<script src="vendor/suncalc.js"></script>
<script src="vendor/togeojson.umd.js"></script>
<script src="vendor/jszip.min.js"></script>
</head>
<body>
<div id="auth" class="auth hidden">
  <form id="authForm" class="auth-card">
    <h1>Hunt HQ <small>BC</small></h1>
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required minlength="6"></label>
    <div class="row">
      <button type="submit" class="primary">Sign in</button>
      <button type="button" id="signupBtn">Create account</button>
    </div>
    <p class="muted">Data syncs to your Supabase project. No connection? <a href="#" id="localModeBtn">Use local mode</a> (stored only in this browser).</p>
    <p id="authMsg" class="err"></p>
  </form>
</div>

<div id="app" class="app hidden panel-closed">
  <div id="map"></div>

  <div class="chrome chrome-tl">
    <button id="menuBtn" class="fab-btn" aria-label="Open tools" title="Tools &amp; logs"><i data-icon="menu"></i><span>Menu</span></button>
    <button id="layersBtn" class="fab-btn" aria-label="Map layers" title="Map layers"><i data-icon="layers"></i><span>Layers</span></button>
  </div>

  <div class="chrome chrome-r">
    <button id="baseBtn" class="round-btn" aria-label="Map type" aria-haspopup="dialog" aria-expanded="false" title="Map type"><i data-icon="basemap"></i></button>
    <button id="terrainBtn" class="round-btn" aria-label="3D terrain" aria-pressed="false" title="3D terrain"><span class="txt3d">3D</span></button>
  </div>

  <div id="basePop" class="popover hidden" role="dialog" aria-label="Map type">
    <label class="switch"><input type="checkbox" id="t3dChk"><span>3D terrain</span></label>
    <div id="exagRow" class="exag-row"><span class="muted">Steepness</span><input type="range" id="exagRng" min="1" max="3" step="0.1" aria-label="3D exaggeration"><output id="exagOut"></output></div>
    <label class="switch"><input type="checkbox" id="hillChk"><span>Hillshade</span></label>
    <label class="switch"><input type="checkbox" id="refChk"><span>Roads &amp; place names</span></label>
    <div class="pop-sep"></div>
    <div class="pop-title">Map type</div>
    <div id="baseGrid" class="base-grid"></div>
    <p class="muted hint-3d">Tilt: right-drag or Ctrl-drag · two-finger drag on phone</p>
  </div>

  <div class="chrome chrome-b">
    <button id="dropBtn" class="pill-btn primary-pill"><i data-icon="pinPlus"></i><span>Drop waypoint</span></button>
    <button id="routeBtn" class="pill-btn" aria-label="Draw a route"><i data-icon="ruler"></i><span>Route</span></button>
  </div>
  <div id="dropHint" class="drop-hint hidden" role="status"><span class="msg">Tap the map to place a waypoint</span><button id="dropCancel" class="link-btn">Cancel</button></div>

  <aside id="panel" class="panel" aria-label="Tools">
    <div class="panel-head">
      <div class="panel-top">
        <div class="sheet-grip" id="sheetGrip" aria-hidden="true"><span></span></div>
        <span class="brand">Hunt HQ</span>
        <button id="panelX" class="icon-btn" aria-label="Close panel"><i data-icon="x" data-size="20"></i></button>
      </div>
      <nav id="tabs" class="tabs" aria-label="Sections">
        <button data-tab="layers"><i data-icon="layers" data-size="20"></i><span>Layers</span></button>
        <button data-tab="open"><i data-icon="calendar" data-size="20"></i><span>Seasons</span></button>
        <button data-tab="log"><i data-icon="pin" data-size="20"></i><span>Waypoints</span></button>
        <button data-tab="trips"><i data-icon="route" data-size="20"></i><span>Hunts</span></button>
        <button data-tab="tags"><i data-icon="tag" data-size="20"></i><span>LEH</span></button>
        <button data-tab="insights"><i data-icon="sun" data-size="20"></i><span>Forecast</span></button>
        <button data-tab="more"><i data-icon="dots" data-size="20"></i><span>More</span></button>
      </nav>
    </div>
    <div id="view" class="view"></div>
  </aside>
</div>

<div id="modal" class="modal hidden"><div class="modal-card" role="dialog" aria-modal="true"><button class="modal-x icon-btn" aria-label="Close"><i data-icon="x"></i></button><div id="modalBody"></div></div></div>
<div id="toast" class="toast off" role="status" aria-live="polite"></div>

<script type="module" src="js/main.js?v=20261113075752-75055de"></script>
</body>
</html>
