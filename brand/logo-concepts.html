<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Logo concepts</title>
<style>
  :root { --pine: #17211a; --bone: #efe7d6; --blaze: #e8742c; --stone: #8d9a8c; --ink: #1b211b; }
  body { margin: 0; font-family: "Inter Display", Inter, system-ui, sans-serif; background: #e9e6de; color: var(--ink); }
  .sheet { width: 1400px; padding: 48px; display: grid; gap: 40px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  .row { display: grid; grid-template-columns: 220px 1fr 1fr; gap: 24px; align-items: stretch; }
  .cell { border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 200px; }
  .dark { background: var(--pine); color: var(--bone); } .light { background: #faf8f3; color: var(--pine); }
  .name { font-size: 15px; font-weight: 600; color: #5b625a; margin: 0 0 -24px 4px; }
  .lockup { display: flex; align-items: center; gap: 22px; }
  .word { font-weight: 900; font-size: 64px; line-height: 1; letter-spacing: 0.06em; }
  .sub { font-weight: 600; font-size: 13px; letter-spacing: 0.32em; opacity: .7; margin-top: 10px; }
  .icons { display: flex; gap: 18px; align-items: end; }
</style></head><body><div class="sheet">
<h1>Two directions, same rugged palette: pine, bone, blaze orange</h1>

<p class="name">Ridgeline</p>
<div class="row">
  <div class="cell dark" style="flex-direction:column;gap:18px">
    <svg width="150" height="150" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/>
      <circle cx="84" cy="36" r="9" fill="#e8742c"/>
      <path d="M10 84 L34 58 L46 68 L64 44 L80 62 L92 54 L110 74" fill="none" stroke="#8d9a8c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
      <path d="M8 96 L30 72 L44 82 L62 56 L76 72 L88 64 L112 90" fill="none" stroke="#efe7d6" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div class="icons"><svg width="40" height="40" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/><circle cx="84" cy="36" r="10" fill="#e8742c"/><path d="M8 94 L32 66 L46 78 L62 54 L78 72 L112 88" fill="none" stroke="#efe7d6" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <svg width="20" height="20" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/><path d="M8 94 L32 66 L46 78 L62 54 L78 72 L112 88" fill="none" stroke="#efe7d6" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
  </div>
  <div class="cell dark"><div class="lockup">
    <svg width="96" height="72" viewBox="0 0 120 90"><circle cx="86" cy="20" r="9" fill="#e8742c"/><path d="M6 70 L30 44 L44 56 L62 30 L78 48 L90 40 L114 66" fill="none" stroke="#efe7d6" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M10 84 L114 84" stroke="#8d9a8c" stroke-width="3" stroke-linecap="round" opacity=".5"/></svg>
    <div><div class="word">RIDGELINE</div><div class="sub">SCOUT · HUNT · LOG</div></div></div></div>
  <div class="cell light"><div class="lockup">
    <svg width="96" height="72" viewBox="0 0 120 90"><circle cx="86" cy="20" r="9" fill="#e8742c"/><path d="M6 70 L30 44 L44 56 L62 30 L78 48 L90 40 L114 66" fill="none" stroke="#17211a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/><path d="M10 84 L114 84" stroke="#8d9a8c" stroke-width="3" stroke-linecap="round" opacity=".6"/></svg>
    <div><div class="word">RIDGELINE</div><div class="sub">SCOUT · HUNT · LOG</div></div></div></div>
</div>

<p class="name">Pack Out</p>
<div class="row">
  <div class="cell dark" style="flex-direction:column;gap:18px">
    <svg width="150" height="150" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/>
      <!-- antlers -->
      <g fill="none" stroke="#e8742c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M54 44 C50 34 44 26 34 20"/><path d="M47 33 L36 34"/><path d="M42 26 L40 16"/>
        <path d="M66 44 C70 34 76 26 86 20"/><path d="M73 33 L84 34"/><path d="M78 26 L80 16"/>
      </g>
      <!-- frame pack -->
      <path d="M37 40 V106 M83 40 V106" stroke="#8d9a8c" stroke-width="4.5" stroke-linecap="round"/><path d="M34 52 H40 M80 52 H86 M34 92 H40 M80 92 H86" stroke="#8d9a8c" stroke-width="4" stroke-linecap="round"/><rect x="40" y="44" width="40" height="56" rx="10" fill="#efe7d6"/>
      <path d="M40 62 H80 M40 80 H80" stroke="#17211a" stroke-width="5"/>
      <rect x="52" y="86" width="16" height="9" rx="3" fill="#17211a"/>
    </svg>
    <div class="icons"><svg width="40" height="40" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/><g fill="none" stroke="#e8742c" stroke-width="9" stroke-linecap="round"><path d="M54 44 C50 32 42 24 32 20"/><path d="M66 44 C70 32 78 24 88 20"/></g><rect x="38" y="44" width="44" height="58" rx="11" fill="#efe7d6"/><path d="M38 66 H82" stroke="#17211a" stroke-width="7"/></svg>
      <svg width="20" height="20" viewBox="0 0 120 120"><rect width="120" height="120" rx="27" fill="#17211a"/><rect x="34" y="34" width="52" height="66" rx="12" fill="#efe7d6"/><path d="M50 34 L36 16 M70 34 L84 16" stroke="#e8742c" stroke-width="12" stroke-linecap="round"/></svg></div>
  </div>
  <div class="cell dark"><div class="lockup">
    <svg width="70" height="84" viewBox="22 8 76 102"><g fill="none" stroke="#e8742c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M54 44 C50 34 44 26 34 20"/><path d="M47 33 L36 34"/><path d="M42 26 L40 16"/><path d="M66 44 C70 34 76 26 86 20"/><path d="M73 33 L84 34"/><path d="M78 26 L80 16"/></g><path d="M37 40 V106 M83 40 V106" stroke="#8d9a8c" stroke-width="4.5" stroke-linecap="round"/><path d="M34 52 H40 M80 52 H86 M34 92 H40 M80 92 H86" stroke="#8d9a8c" stroke-width="4" stroke-linecap="round"/><rect x="40" y="44" width="40" height="56" rx="10" fill="#efe7d6"/><path d="M40 62 H80 M40 80 H80" stroke="#17211a" stroke-width="5"/></svg>
    <div><div class="word" style="letter-spacing:.02em">PACK OUT</div><div class="sub">MAPS · LOGS · DRAWS</div></div></div></div>
  <div class="cell light"><div class="lockup">
    <svg width="70" height="84" viewBox="22 8 76 102"><g fill="none" stroke="#e8742c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"><path d="M54 44 C50 34 44 26 34 20"/><path d="M47 33 L36 34"/><path d="M42 26 L40 16"/><path d="M66 44 C70 34 76 26 86 20"/><path d="M73 33 L84 34"/><path d="M78 26 L80 16"/></g><path d="M37 40 V106 M83 40 V106" stroke="#8d9a8c" stroke-width="4.5" stroke-linecap="round"/><path d="M34 52 H40 M80 52 H86 M34 92 H40 M80 92 H86" stroke="#8d9a8c" stroke-width="4" stroke-linecap="round"/><rect x="40" y="44" width="40" height="56" rx="10" fill="#17211a"/><path d="M40 62 H80 M40 80 H80" stroke="#faf8f3" stroke-width="5"/></svg>
    <div><div class="word" style="letter-spacing:.02em">PACK OUT</div><div class="sub">MAPS · LOGS · DRAWS</div></div></div></div>
</div>
</div></body></html>
